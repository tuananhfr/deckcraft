[package]
name = "deckcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft desktop app"
publish = false
default-run = "deckcraft"

[lints]
workspace = true

[dependencies]
erpcons-update = { git = "https://github.com/tuananhfr/erpcons-update", tag = "v0.1.0" }
# Optional PI ID sign-in; inert unless the build sets ERPCONS_PI_ISSUER (`src/account.rs`).
erpcons-account = { git = "https://github.com/tuananhfr/erpcons-account", tag = "v0.1.1" }
# Opens the PI ID sign-in page in the system browser.
open = "5"
deckcraft-engine = { workspace = true }
deckcraft-ui-egui = { workspace = true }
deckcraft-media = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "links", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tempfile = "3.27"

[dev-dependencies]
# In-process PI Platform mock for the account adapter's sign-in tests.
pi-mock = { git = "https://github.com/tuananhfr/erpcons-account", tag = "v0.1.1" }

[build-dependencies]
# Icon + VERSIONINFO for deckcraft.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
arboard = { workspace = true, features = ["image-data"] }
image = { workspace = true }
cpal = "0.16"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Finder double-click, Open With, Dock drops and `open -a` with a file arrive as a
# kAEOpenDocuments Apple event, which winit 0.30 doesn't handle. This audited crate (also used
# by the sibling ERPCons apps) registers the handler (Objective-C interop needs unsafe, which our
# workspace forbids) behind a safe API. Pinned exactly: review the diff before bumping.
fmv-macos-events = "=0.1.0"
